# Cheap checks: crucial for correctness (typecheck), or cheap if not crucial
# (format, lint on staged files, secret scan). Knip, build and tests run in CI.
pre-commit:
  parallel: true
  commands:
    prettier:
      run: pnpm exec prettier --ignore-unknown --write {staged_files}
      stage_fixed: true
    lint:
      glob: '**/*.{ts,tsx,js,jsx,mjs}'
      run: pnpm exec oxlint {staged_files} && pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
    secrets:
      run: node scripts/run-gitleaks-staged.ts
    typecheck:
      run: pnpm types:check
